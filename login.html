<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSC426 Secure Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: radial-gradient(circle at center, #1e293b, #0f172a); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
        .auth-container { background: #ffffff; padding: 36px; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); width: 100%; max-width: 380px; }
        .auth-header { margin-bottom: 28px; text-align: center; }
        .auth-header h2 { color: #1e293b; font-size: 26px; font-weight: 700; }
        .auth-header p { color: #64748b; font-size: 14px; margin-top: 4px; }
        .input-wrapper { margin-bottom: 18px; }
        .input-wrapper label { display: block; margin-bottom: 6px; color: #334155; font-weight: 600; font-size: 14px; }
        .input-field { width: 100%; padding: 10px 14px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 15px; color: #1e293b; outline: none; transition: all 0.2s ease; }
        .input-field:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); }
        .action-deck { display: flex; gap: 12px; margin-top: 26px; }
        .btn { flex: 1; padding: 11px; font-size: 15px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; transition: background-color 0.2s ease; }
        .btn-primary { background-color: #6366f1; color: #ffffff; }
        .btn-primary:hover { background-color: #4f46e5; }
        .btn-secondary { background-color: #f1f5f9; color: #475569; }
        .btn-secondary:hover { background-color: #e2e8f0; }
        .status-alert { padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none; font-size: 14px; font-weight: 500; text-align: center; animation: fadeIn 0.3s ease; }
        .status-success { background-color: #dcfce7; color: #14532d; border: 1px solid #bbf7d0; display: block; }
        .status-error { background-color: #fee2e2; color: #7f1d1d; border: 1px solid #fecaca; display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <h2>CSC426 Portal</h2>
            <p>Please log in to continue</p>
        </div>
        
        <div id="alertBanner" class="status-alert"></div>
        
        <form id="authForm">
            <div class="input-wrapper">
                <label for="uid">Username</label>
                <input type="text" id="uid" class="input-field" placeholder="Username or email">
            </div>
            <div class="input-wrapper">
                <label for="uKey">Password</label>
                <input type="password" id="uKey" class="input-field" placeholder="••••••••">
            </div>
            <div class="action-deck">
                <button type="button" class="btn btn-secondary" id="clearBtn">Cancel</button>
                <button type="submit" class="btn btn-primary">Login</button>
            </div>
        </form>
    </div>

    <script>
        const gatekeeperForm = document.getElementById('authForm');
        const userField = document.getElementById('uid');
        const passField = document.getElementById('uKey');
        const alertBanner = document.getElementById('alertBanner');
        const clearBtn = document.getElementById('clearBtn');

        function triggerAlert(messageText, successState) {
            alertBanner.textContent = messageText;
            alertBanner.className = 'status-alert ' + (successState ? 'status-success' : 'status-error');
            alertBanner.style.display = 'block';
        }

        gatekeeperForm.addEventListener('submit', function(event) {
            event.preventDefault();
            const processUser = userField.value.trim();
            const processPass = passField.value.trim();

            if (!processUser || !processPass) {
                triggerAlert('Validation Error: All credentials are required.', false);
                return;
            }

            if (processPass.length < 6) {
                triggerAlert('Security Error: Password fails minimum length rules.', false);
                return;
            }

            triggerAlert('Authentication Successful! Welcome to the portal.', true);
        });

        clearBtn.addEventListener('click', function() {
            gatekeeperForm.reset();
            alertBanner.style.display = 'none';
        });
    </script>
</body>
</html>
